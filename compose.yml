services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lawoffice
      POSTGRES_USER: lawoffice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawoffice}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lawoffice -d lawoffice"], interval: 5s, timeout: 3s, retries: 15}
    restart: unless-stopped
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: 8080
      DATABASE_URL: postgres://lawoffice:${POSTGRES_PASSWORD:-lawoffice}@postgres:5432/lawoffice?sslmode=disable
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-development-only}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      STORAGE_PATH: /data/storage
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_TLS: ${S3_USE_TLS:-true}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}
      UPLOAD_SCAN_MODE: ${UPLOAD_SCAN_MODE:-off}
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
      SMTP_MODE: ${SMTP_MODE:-off}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-LawOffice OS}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      JOB_ENCRYPTION_SECRET: ${JOB_ENCRYPTION_SECRET:-}
      MIGRATIONS_DIR: /app/migrations
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-pt-BR}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      OCR_MODE: ${OCR_MODE:-off}
      OCR_ENDPOINT: ${OCR_ENDPOINT:-}
      OCR_TOKEN: ${OCR_TOKEN:-}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-pt-BR}
      OCR_MAX_INPUT_MB: ${OCR_MAX_INPUT_MB:-25}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-1000}
      OCR_MAX_CHARACTERS: ${OCR_MAX_CHARACTERS:-5000000}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-90}
    volumes: [document_storage:/data/storage]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    ports: ["3000:8080"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
  document_storage:
