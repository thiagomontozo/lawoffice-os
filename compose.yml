services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lawoffice
      POSTGRES_USER: lawoffice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawoffice}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lawoffice -d lawoffice"], interval: 5s, timeout: 3s, retries: 15}
    restart: unless-stopped
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_PORT: 8080
      DATABASE_URL: postgres://lawoffice:${POSTGRES_PASSWORD:-lawoffice}@postgres:5432/lawoffice?sslmode=disable
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-development-only}
      STORAGE_PATH: /data/storage
      MIGRATIONS_DIR: /app/migrations
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-pt-BR}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
    volumes: [document_storage:/data/storage]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    ports: ["3000:8080"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
  document_storage:
