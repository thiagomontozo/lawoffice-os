server { listen 8080; server_name _; root /usr/share/nginx/html; index index.html; client_max_body_size 25m; location / { try_files $uri /index.html; } location /api/ { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 65s; } location = /healthz { proxy_pass http://backend:8080; } location = /readyz { proxy_pass http://backend:8080; } }
